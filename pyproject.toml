[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-evaluation-workbench"
version = "0.1.0"
description = "Application-specific evaluation and run comparison for LLM systems"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Sumeet Amin"}]
dependencies = []

[project.optional-dependencies]
benchmark = ["scikit-learn>=1.4,<2"]

[project.scripts]
evalbench = "evalbench.cli:main"

[tool.setuptools]
packages = ["evalbench"]

